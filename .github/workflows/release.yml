name: Создание релиза
run-name: Создание релиза ${{ github.event.inputs.version_number }}

on:
  workflow_dispatch:
    inputs:
      version_number:
        description: 'Номер версии'
        required: true
        default: '0.0.0'

env:
  REGISTRY_HOST: github.com


jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.version_number }}
      RELEASE_NAME: ${{ github.event.inputs.version_number }}
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Установка uv
        uses: astral-sh/setup-uv@v7

      - name: Обновление номера версии
        run: |
          sed -i "s/^version = .*/version = \"${{ github.event.inputs.version_number }}\"/" pyproject.toml
          uv lock
      
      - name: Фиксация изменений версии
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "New: Новая версия ${{ github.event.inputs.version_number }}"
          git push

      - name: Подготовка описания релиза
        run: |
          git fetch --tags
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          REPO_URL="http://${{ env.REGISTRY_HOST }}/${{ github.repository }}"

          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG"..HEAD --pretty=format:"- [%s]($REPO_URL/commit/%H)" > release_notes.txt
            echo -e "\n\n[Сравнить изменения $PREV_TAG...${{ env.TAG }}]($REPO_URL/compare/$PREV_TAG...${{ env.TAG }})" >> release_notes.txt
          else
            git log --pretty=format:"- [%s]($REPO_URL/commit/%H)" > release_notes.txt
          fi

      - name: Вывод описания релиза
        run: |
          echo "Release notes:"
          cat release_notes.txt

      - name: Создание тега и релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.RELEASE_NAME }}
          body_path: release_notes.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
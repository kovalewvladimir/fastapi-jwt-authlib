name: Публикация в PyPI

on:
  workflow_run:
    workflows: ["Создание релиза"]
    types: [completed]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Получение исходного кода
      uses: actions/checkout@v4

    - name: Получение версии из коммита
      id: version
      run: |
        VERSION=$(git log -1 --pretty=%B | grep -oP 'версия \K[0-9.]+' || echo "unknown")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Публикация версии $VERSION" >> $GITHUB_STEP_SUMMARY

    - name: Установка uv
      uses: astral-sh/setup-uv@v4

    - name: Установка Python
      run: uv python install

    - name: Сборка пакета
      run: uv build

    - name: Публикация в PyPI
      run: uv publish
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}